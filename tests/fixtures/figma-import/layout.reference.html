<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0} .card{box-sizing:border-box;position:relative;width:320px;height:200px;background:#fff;display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:24px;overflow:hidden}
.title{position:relative;margin:0;font:500 20px/28px Inter;white-space:pre;color:#1a1a1a}
.button{position:relative;align-self:stretch;height:44px;flex-shrink:0;background:#3366cc;display:flex;align-items:center;justify-content:center}
.label{margin:0;font:400 14px/20px Inter;white-space:pre;color:#fff}.badge{position:absolute;left:290px;top:10px;width:20px;height:20px;border-radius:50%;background:#3366cc}
</style></head><body><div class="card"><h3 class="title">Import Fidelity</h3><div class="button"><p class="label">Continue</p></div><div class="badge"></div></div></body></html>
